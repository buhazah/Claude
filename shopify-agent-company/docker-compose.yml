# Two services from one image:
#   mcp     — the local Shopify Admin MCP server (holds the Admin token)
#   company — the agent company running --autopilot, talking to mcp over the
#             internal docker network.
#
# Secrets come from the .env file at runtime (env_file). They are never baked
# into the image. Keep .env on the host only (it is gitignored + dockerignored).

services:
  mcp:
    build: .
    image: shopify-agent-company:latest
    command: python mcp_server/shopify_mcp.py
    env_file: .env
    environment:
      PORT: "8000"
    expose:
      - "8000"           # internal only; not published to the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex(('localhost',8000))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  company:
    image: shopify-agent-company:latest
    command: python run.py --autopilot
    env_file: .env
    environment:
      # Inside the compose network the MCP server is reachable by service name.
      SHOPIFY_MCP_URL: "http://mcp:8000/mcp"
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
