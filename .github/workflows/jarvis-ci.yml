name: Jarvis CI

on:
  push:
    paths: ["jarvis/**", ".github/workflows/jarvis-ci.yml"]
  pull_request:
    paths: ["jarvis/**", ".github/workflows/jarvis-ci.yml"]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
          POSTGRES_DB: jarvis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jarvis" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      # Computer control drives a real browser, so CI exercises the driver
      # rather than skipping past it.
      - run: .venv/bin/playwright install --with-deps chromium
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      # Offline first: no keys, no services, no network. This is the run that
      # proves Jarvis works with nothing configured (see docs/adr/0001).
      - run: .venv/bin/python -m pytest -q
      # Then the same suite again with the backends live, which additionally
      # exercises the Postgres, pgvector and Redis paths.
      - run: .venv/bin/python -m pytest -q
        env:
          JARVIS_TEST_POSTGRES_URL: postgresql+asyncpg://jarvis:jarvis@localhost:5432/jarvis
          JARVIS_TEST_REDIS_URL: redis://localhost:6379/0
      # The free half of the intelligence corpus: routing scored on stage one
      # alone, and memory recall against the store. No key, no network, nothing
      # spent — and it fails the build if the router got worse, which is the
      # regression that otherwise shows up only as latency and spend.
      - run: .venv/bin/python -m eval --free --no-probes --baseline eval/baseline.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarvis/apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The e2e suites drive both servers through a real browser, and they have
  # caught more genuine bugs in this project than any other check — the unpaced
  # speaker that made barge-in impossible, the secret-field false positive, the
  # approval gate that was unreachable dead code. They ran only on a developer
  # machine until now.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      # The `computer` extra, not the bare package: the computer-control suite
      # drives a real browser from the kernel, and without playwright the
      # driver reports itself unavailable and that suite fails at its first
      # assertion.
      - name: Install the kernel
        working-directory: jarvis/apps/api
        run: |
          uv venv --python 3.11
          uv pip install -e ".[computer]"
          .venv/bin/playwright install --with-deps chromium

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarvis/apps/web/pnpm-lock.yaml
      - name: Install and build the client
        working-directory: jarvis/apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build

      # One API serves every suite. Computer control and the vault are additive
      # — the suites that ignore them are unaffected — so this avoids starting
      # three servers to run eight files.
      - name: Start both servers
        working-directory: jarvis
        env:
          JARVIS_ENABLE_COMPUTER: "true"
          JARVIS_BROWSER_ALLOWED_HOSTS: '["127.0.0.1"]'
          JARVIS_LOG_LEVEL: WARNING
        run: |
          export JARVIS_VAULT_KEY="$(apps/api/.venv/bin/python -m jarvis.security.keygen)"
          apps/api/.venv/bin/uvicorn jarvis.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          (cd apps/web && pnpm start > /tmp/web.log 2>&1 &)

      - name: Run every suite
        working-directory: jarvis/apps/web
        run: |
          node e2e/wait.mjs
          node e2e/smoke.mjs
          node e2e/approval.mjs
          node e2e/knowledge.mjs
          node e2e/workflows.mjs
          node e2e/voice.mjs
          node e2e/modes.mjs
          node e2e/computer.mjs
          node e2e/settings.mjs
          node e2e/briefing.mjs

      # A browser failure is almost always visual, and the screenshot each suite
      # takes is the fastest way to see it without reproducing locally.
      - name: Collect evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            /tmp/shot-*.png
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: ignore
