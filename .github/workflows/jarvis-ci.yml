name: Jarvis CI

on:
  push:
    paths: ["jarvis/**", ".github/workflows/jarvis-ci.yml"]
  pull_request:
    paths: ["jarvis/**", ".github/workflows/jarvis-ci.yml"]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      # No API keys and no network access are needed: the suite runs against
      # the offline provider by design (see docs/adr/0001).
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/python -m pytest -q
