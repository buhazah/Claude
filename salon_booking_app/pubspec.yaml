name: salon_booking_app
description: >-
  UAE salon booking marketplace — Flutter + Firebase MVP foundation.
  Customers discover salons and book appointments; salon owners manage
  services, bookings, availability and offers from a dedicated dashboard.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  # Notifications-ready (wiring lives in core/services/push_notifications_service.dart).
  firebase_messaging: ^15.1.3

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Utilities / UI
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
