# Render Blueprint (repo root) — one-click deploy of the Operator AI backend.
#
# Render auto-detects render.yaml at the REPO ROOT. The app lives in
# shopify-agent-company/, so the Docker paths point into that subdirectory.
#
# Two services from the single Docker image:
#   shopify-mcp     — private service holding the Shopify Admin MCP server.
#   operator-runner — public HTTPS API the web app's edge function calls.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick repo buhazah/Claude ->
# branch claude/happy-keller-k19t1x. Then fill the secret env vars
# (marked sync:false) in the dashboard. Secrets are NEVER committed.

services:
  # ---------------------------------------------------------------------------
  # Private MCP server — not exposed to the public internet. Reachable only by
  # the runner over Render's private network at http://shopify-mcp:8000/mcp.
  # ---------------------------------------------------------------------------
  - type: pserv
    name: shopify-mcp
    runtime: docker
    dockerfilePath: ./shopify-agent-company/Dockerfile
    dockerContext: ./shopify-agent-company
    # Override the Dockerfile default CMD (python run.py --autopilot). This
    # service is ONLY the MCP server; without this override Render boots the
    # autopilot company instead and the deploy fails on startup.
    dockerCommand: python mcp_server/shopify_mcp.py
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      # REQUIRED: the MCP server exits at startup if these are blank. Fill them
      # in the Render dashboard with your store's Admin creds (e.g. Aluvae:
      # cvqpju-j0.myshopify.com + its shpat_ Admin token).
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false

  # ---------------------------------------------------------------------------
  # Public runner API. The Supabase edge function calls this with X-Platform-Key.
  # ---------------------------------------------------------------------------
  - type: web
    name: operator-runner
    runtime: docker
    dockerfilePath: ./shopify-agent-company/Dockerfile
    dockerContext: ./shopify-agent-company
    dockerCommand: uvicorn runner.app:app --host 0.0.0.0 --port $PORT
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_MCP_URL
        value: http://shopify-mcp:8000/mcp   # internal private-network address
      - key: ANTHROPIC_API_KEY               # your single operator key
        sync: false
      - key: PLATFORM_API_KEY                # shared secret with the edge function
        sync: false
      # No Supabase keys needed: the Lovable Cloud edge function reads the store
      # row server-side and passes tenant data inline to POST /run. Lovable Cloud
      # does not expose the service_role key, so the runner never touches it.
