# Render Blueprint for JARVIS — one-click deploy with a managed Postgres.
# Deploy: https://render.com/deploy?repo=https://github.com/buhazah/Claude
# Render reads this file from the repo root; the app itself lives in jarvis/.
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    dockerfilePath: jarvis/Dockerfile
    dockerContext: jarvis
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Signing key for JWTs — generated once and kept stable by Render.
      - key: JARVIS_SECRET_KEY
        generateValue: true
      # Managed Postgres connection string (normalized to asyncpg at runtime).
      - key: JARVIS_DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      # REQUIRED: paste your key in the Render dashboard after first deploy.
      - key: ANTHROPIC_API_KEY
        sync: false
      # OPTIONAL: voice. Leave blank to use the browser speech fallback.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Lock down signups after you create the first (owner) account.
      - key: JARVIS_ALLOW_REGISTRATION
        value: "true"
      # OPTIONAL account integrations (Calendar/Gmail/Spotify). Leave blank
      # until you follow docs/INTEGRATIONS.md; weather + news work without them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

databases:
  - name: jarvis-db
    plan: free
    # Free Render Postgres is deleted after ~30 days of the free period; move to
    # a paid instance for anything you want to keep.
