[project]
name = "jarvis-api"
version = "0.1.0"
description = "Jarvis — personal AI operating system, core service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    # Document extraction. Each is small, pure-python and lazily imported, so a
    # missing one degrades that one format rather than breaking ingestion.
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

# postgres / redis extras are optional: Jarvis runs local-first on SQLite with
# an in-process bus, and only needs these when pointed at a server.
[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
    "pgvector>=0.3",
]
redis = [
    "redis>=5.2",
]
dev = [
    "asyncpg>=0.30",
    "pgvector>=0.3",
    # Alembic runs migrations synchronously; the async driver cannot serve it.
    "psycopg2-binary>=2.9",
    "redis>=5.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:jarvis.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic writes these; reformatting them only creates diff noise on every
# autogenerate, and their content is asserted by the schema-drift test.
extend-exclude = ["src/jarvis/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic dashes are intentional in prose and in citation locators
# ("pp. 3–4"), which are shown to people.
ignore = ["RUF001", "RUF002", "RUF003"]

[[tool.mypy.overrides]]
# These parsers ship no type stubs; their surface here is small and wrapped.
module = ["pypdf.*", "docx.*", "pptx.*", "openpyxl.*", "pgvector.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
packages = ["jarvis"]
mypy_path = "src"
strict = true
warn_return_any = false
